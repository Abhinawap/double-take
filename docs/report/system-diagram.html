<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answer-stability check</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · A2 report</p>
    <h1>Answer-stability check</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-diagram-title system-diagram-desc">
        <title id="system-diagram-title">Answer-stability check</title>
        <desc id="system-diagram-desc">A student's question passes through leading-question detection, two answers and a judge; the app shows either a plain answer or an instability warning, with replay mode simulated and extra triggers planned.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="368" y="128" width="340" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="476" y="132" width="224" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="141" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CHECK() · AI → GPT-OSS-120B · NEBIUS</text>

        <rect x="736" y="128" width="184" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="776" y="132" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="828" y="141" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHOWN · APP.PY</text>

        <!-- Arrows (behind nodes) -->
        <!-- Student -> Question box -->
        <line x1="152" y1="264" x2="200" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Question box -> Detect / Answers (parallel) -->
        <path d="M 328,252 H 340 Q 348,252 348,244 V 188 Q 348,180 356,180 H 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 328,276 H 340 Q 348,276 348,284 V 344 Q 348,352 356,352 H 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Detect -> Answers (leading) -->
        <line x1="458" y1="208" x2="458" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Answers -> Judge -->
        <line x1="532" y1="352" x2="568" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Detect -> Plain answer (not leading) -->
        <line x1="532" y1="176" x2="752" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Judge -> Plain answer (same) -->
        <path d="M 628,320 V 208 Q 628,200 636,200 H 752" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Judge -> Warning (different) -->
        <line x1="688" y1="352" x2="752" y2="352" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Warning -> Student (checks notes) -->
        <path d="M 804,392 V 428 Q 804,436 796,436 H 104 Q 96,436 96,428 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Replay -> Warning (simulated) -->
        <line x1="856" y1="460" x2="856" y2="392" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Planned -> Detect -->
        <line x1="458" y1="112" x2="458" y2="152" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="1,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="466" y="258" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="267" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LEADING</text>

        <rect x="552" y="156" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="586" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOT LEADING</text>

        <rect x="636" y="250" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAME</text>

        <rect x="694" y="332" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="720" y="341" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIFFERENT</text>

        <rect x="388" y="416" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="424" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECKS NOTES</text>

        <rect x="864" y="444" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="892" y="453" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVED RUN</text>

        <rect x="164" y="244" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="180" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TYPES</text>

        <!-- Node: Student (input) -->
        <rect x="40" y="232" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="232" width="112" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="240" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="64" y="249" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="96" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Student</text>
        <text x="96" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">revising</text>

        <!-- Node: Question box -->
        <rect x="200" y="228" width="128" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="228" width="128" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="208" y="236" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="218" y="245" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="264" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Question box</text>
        <text x="264" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Streamlit app</text>
        <text x="264" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scope + progress</text>

        <!-- Node: Planned triggers -->
        <rect x="384" y="40" width="148" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="40" width="148" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="1,3"/>
        <rect x="392" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
        <text x="408" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>
        <text x="458" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">More triggers</text>
        <text x="458" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ask twice · pushback</text>
        <text x="458" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v3 "why" rewrite</text>

        <!-- Node: Detect (AI) -->
        <rect x="384" y="152" width="148" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="152" width="148" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="392" y="160" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="402" y="169" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
        <text x="458" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detect leading</text>
        <text x="458" y="199" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">writes neutral version</text>

        <!-- Node: Answers (AI) -->
        <rect x="384" y="320" width="148" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="320" width="148" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="392" y="328" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="402" y="337" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
        <text x="458" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Answer both</text>
        <text x="458" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">original + neutral</text>
        <text x="458" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">held, not streamed</text>

        <!-- Node: Judge (AI) -->
        <rect x="568" y="320" width="120" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="320" width="120" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="576" y="328" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="586" y="337" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
        <text x="628" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Judge</text>
        <text x="628" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">main claims</text>
        <text x="628" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">strict JSON, 1 retry</text>

        <!-- Node: Plain answer -->
        <rect x="752" y="152" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="152" width="152" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="760" y="160" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="774" y="169" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="828" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plain answer</text>
        <text x="828" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no badge</text>
        <text x="828" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">or "couldn't compare"</text>

        <!-- Node: Instability warning (focal) -->
        <rect x="752" y="320" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="320" width="152" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="760" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="774" y="337" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="828" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Instability warning</text>
        <text x="828" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replaces the answer</text>
        <text x="828" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">both Qs, claims, answers</text>

        <!-- Node: Replay mode (simulated) -->
        <rect x="752" y="460" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="460" width="152" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="760" y="468" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
        <text x="774" y="477" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIM</text>
        <text x="828" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replay mode</text>
        <text x="828" y="507" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replays/*.json · no key</text>

        <!-- Legend strip -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="40" y1="574" x2="68" y2="574" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="76" y="577" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Implemented</text>

        <line x1="164" y1="574" x2="192" y2="574" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="200" y="577" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Simulated (saved runs)</text>

        <line x1="336" y1="574" x2="364" y2="574" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="1,3" marker-end="url(#arrow)"/>
        <text x="372" y="577" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Planned</text>

        <rect x="448" y="568" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="458" y="577" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
        <text x="476" y="577" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">LLM call</text>

        <rect x="556" y="569" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="576" y="577" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal: warning path</text>

        <rect x="696" y="569" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="716" y="577" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Person</text>
      </svg>
    </div>
  </div>
</body>
</html>
